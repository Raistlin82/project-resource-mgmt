# App-service OVERLAY for the full-stack Docker deploy.
#
# Compose this on TOP of docker-compose.yml (which provides postgres + keycloak):
#
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
#
# That brings up Postgres 17, Keycloak 26 (prod mode, realm 'psa'), AND the
# Delivery Control app — all three in containers on the same compose network.
#
# Browser-vs-SSR issuer caveat (READ THIS):
#   * The BROWSER talks to Keycloak at http://localhost:8081/realms/psa (host
#     port 8081; host 8080 is owned by openHAB). Tokens it obtains carry
#     iss=http://localhost:8081/realms/psa.
#   * The API validates the public issuer value but fetches keys from the
#     internal OIDC_JWKS_URI (`keycloak:8080`), which is resolvable on the
#     Compose network and avoids the container-localhost trap.
#   * For a SINGLE-HOST local deploy this works because the tokens are
#     browser-obtained and the issuer stays localhost:8081 for both sides. A real
#     MULTI-HOST production deploy needs a STABLE EXTERNAL issuer URL (a DNS name
#     + TLS) configured identically in Keycloak (KC_HOSTNAME), the SPA
#     (AuthService ISSUER), and OIDC_ISSUER here — never a per-container
#     "localhost".

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: delivery-control-app:latest
    container_name: prm-app
    restart: unless-stopped
    environment:
      # --- Persistence (Postgres service on the compose network) -------------
      # Reaches the 'postgres' service by name; the APP database is
      # project_resource_mgmt (Keycloak uses its own 'keycloak' db).
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-project_resource_mgmt}"
      PERSISTENCE_ADAPTER: "postgresql"
      # Fresh production databases stay empty unless demo seed is explicitly opted in.
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-false}"
      # Local docker Postgres has no TLS; never set PGSSL=true here.
      PGSSL: "false"

      # --- Identity (Keycloak / OIDC) ----------------------------------------
      # MUST byte-match the `iss` on browser-obtained tokens (localhost:8081).
      # See the issuer caveat above for why this stays localhost, not the
      # 'keycloak' service name.
      OIDC_ISSUER: "${OIDC_ISSUER:-http://localhost:8081/realms/psa}"
      OIDC_PUBLIC_ISSUER: "${OIDC_PUBLIC_ISSUER:-http://localhost:8081/realms/psa}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-psa-web}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-psa-web}"
      OIDC_JWKS_URI: "${OIDC_JWKS_URI:-http://keycloak:8080/realms/psa/protocol/openid-connect/certs}"
      # PRODUCTION SAFETY: never trust the spoofable X-User-* demo headers in a
      # containerized deploy. Identity comes from verified JWTs only.
      AUTH_TRUST_HEADERS: "false"

      # --- HTTP bind ---------------------------------------------------------
      PORT: "3000"
      HOST: "0.0.0.0"
      # Hostnames Angular SSR host-validation accepts (server.ts NG_ALLOWED_HOSTS).
      NG_ALLOWED_HOSTS: "${NG_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      # API_BASE_URL is intentionally UNSET: the SSR server derives its own /api
      # base from PORT/HOST (see app.config.server.ts), which is correct here.
    ports:
      - "3000:3000"
    extra_hosts:
      # Lets the SSR server resolve the host gateway, so the issuer's
      # localhost:8081 (published Keycloak port) is reachable from inside the
      # container on Linux engines too. See the issuer caveat above.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
